name: PayGate402 staging image

on:
  push:
    branches: [paygate402/cloudflare-staging]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Linux image
        run: docker build --platform linux/amd64 --file deploy/cloudflare/Dockerfile --tag paygate402-staging:build .
      - name: Export the image for the Cloudflare registry
        run: docker save paygate402-staging:build | gzip -1 > paygate402-staging.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: paygate402-staging-image
          path: paygate402-staging.tar.gz
          retention-days: 1
